        .stat-line {
            margin-bottom: 8px;

        #gameOverOverlay {
            display: none;
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Press Start 2P', cursive;
            color: #0f0;
        }

        .game-over-content {
            text-align: center;
        }

        #gameOverOverlay h1 {
            font-size: 20px;
            margin-bottom: 24px;
        }

        #restartButton, #backButton {
            width: 200px;
            text-align: center;
            margin: 10px;
            padding: 12px 24px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            background-color: #000;
            color: #0f0;
            border: 2px solid #0f0;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        #restartButton:hover, #backButton:hover {
            background-color: #0f0;
            color: #000;
            transform: scale(1.05);
        }

        #pauseOverlay {
            display: none;
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 998;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #resumeButton {
            padding: 12px 24px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            background-color: #000;
            color: #0f0;
            border: 2px solid #0f0;
            cursor: pointer;
        }
        
        #pauseMessage {
            color: #0f0;
            font-size: 16px;
            text-align: center;
            animation: blink 1.2s step-end infinite;
            font-family: 'Press Start 2P', cursive;
        }
        #congratsOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Press Start 2P', cursive;
            color: #0f0;
            text-align: center;
            animation: fadeOut 3s forwards;
        }

        #congratsOverlay h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #congratsOverlay p {
            font-size: 12px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        #minimapContainer {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            border: 2px solid #0f0;
            background-color: #000;
            z-index: 20;
        }

        #minimap {
            width: 100%;
            height: 100%;
            display: block;
        }
        #startTip {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background-color: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 18px;
            z-index: 1000;
            display: none;
            animation: fadeTip 10s forwards;
        }

        @keyframes fadeTip {
            0%   { opacity: 1; }
            80%  { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/",
            "stats.js": "https://esm.sh/stats.js"
          }
        }
    </script>
</head>
<body>
    <div id="webgl"></div>
    <div id="minimapContainer">
        <canvas id="minimap"></canvas>
    </div>
    <button id="statsButton" onclick="toggleStats()">STATS</button>

    <div id="statsPanel">
        <div class="stat-line">💀 Score: <span id="score">0</span></div>
        <div class="stat-line">❤️ Health: <span id="health">100</span></div>
        <div class="stat-line">🗡️ DMG: <span id="dmg">10</span></div>
        <div class="stat-line">⚡ Speed: <span id="speed">5</span></div>
        <div class="stat-line">🕒 Time: <span id="time">0</span>s</div>
    </div>

    <!-- Back button -->
    <div id="gameOverOverlay">
        <div class="game-over-content">
            <h1>GAME OVER</h1>
            <button id="restartButton" onclick="restartGame()">🔁 RESTART</button>
            <button id="backButton" onclick="goBack()">⬅ BACK</button>
        </div>
    </div>

    <!-- Resume button -->
    <div id="pauseOverlay">
        <!--<button id="resumeButton" onclick="resumeGame()">▶ RESUME</button>-->
        <div id="pauseMessage">▶ Press p to continue</div>
        <button id="restartButton" onclick="restartGame()">🔁 RESTART</button>
        <button id="backButton" onclick="goBack()">⬅ BACK</button>
    </div>

    <div id="startTip">Press p to stop</div>

    <!-- Stats logic -->
    <script>
        function toggleStats() {
            const panel = document.getElementById('statsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        let seconds = 0;
        //const savedScore = localStorage.getItem('lastScore');
        /*if (savedScore !== null) {
            score = parseInt(savedScore, 10);
            document.getElementById('score').textContent = score;
        }*/

        setInterval(() => {
            seconds++;
            document.getElementById('time').textContent = seconds;
            //localStorage.setItem('lastScore', score);
        }, 1000);

        function goBack() {
            window.location.href = "start_screen.html";
        }
        function restartGame() {
            location.reload();
        }
    </script>

    <script type="module" src="./main.js"></script>
    <script type="module">
        import Stats from "stats.js";

        const stats = new Stats();
        stats.showPanel(0);
        document.body.appendChild(stats.dom);

        function animate() {
            stats.begin();
            // monitored code here
            stats.end();
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
