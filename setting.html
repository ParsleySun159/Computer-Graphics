<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug Hunter - Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      color: #0f0;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 20px;
      text-align: center;
    }

    .settings-box {
      border: 2px solid #0f0;
      padding: 30px 40px;
      background-color: #111;
      width: 400px;
      max-width: 90%;
    }

    label {
      display: block;
      margin-top: 20px;
      font-size: 12px;
    }

    select {
      margin-top: 5px;
      padding: 6px;
      font-size: 12px;
      font-family: 'Press Start 2P', cursive;
      background-color: #000;
      color: #0f0;
      border: 1px solid #0f0;
      width: 100%;
    }

    input[type="checkbox"] {
      margin-top: 5px;
      accent-color: #0f0;
      transform: scale(1.2); /* Optional: make checkbox larger */
    }

    .btn {
      margin-top: 40px;
      padding: 12px 20px;
      background-color: #000;
      border: 2px solid #0f0;
      color: #0f0;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background-color: #0f0;
      color: #000;
    }
  </style>
</head>
<body>

  <h1>⚙ SETTINGS</h1>

  <div class="settings-box">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" onchange="saveDifficulty(this.value)">
      <option value="easy">EASY</option>
      <option value="medium" selected>MEDIUM</option>
      <option value="hard">HARD</option>
    </select>

    <label for="intensity">Brightness
      <input type="range" id="lightIntensity" min="-1" max="2" step="0.5" onchange="updateLightIntensity(this.value)">
      <span id="brightnessValue">0.5</span>
    </label>
    <label>
      <input type="checkbox" id="music" onchange="toggleMusicSetting(this.checked)">
      MUSIC ON
    </label>

    <button class="btn" onclick="goBack()">← BACK</button>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }
    // Load the stored setting on page load
    document.addEventListener('DOMContentLoaded', () => {
      const musicOn = localStorage.getItem('music') !== 'false';
      document.getElementById('music').checked = musicOn;

      const storedDifficulty = localStorage.getItem('difficulty') || 'medium';
      document.getElementById('difficulty').value = storedDifficulty;

      const lightIntensity = localStorage.getItem('intensity') || 0.5;
      document.getElementById('lightIntensity').value = lightIntensity;
    });

    function toggleMusicSetting(isChecked) {
      localStorage.setItem('music', isChecked);
    }

    function saveDifficulty(value) {
      localStorage.setItem('difficulty', value);
    }

    function updateLightIntensity(value) {
      const val = parseFloat(value);
      localStorage.setItem('intensity', val);
      document.getElementById('brightnessValue').textContent = val;
    }
  </script>
</body>
</html>
